<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时帧率监控</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --edge:#232833;
    --text:#e6e8ec; --dim:#8b93a7; --faint:#4b5261;
    --green:#3ddc84; --yellow:#ffb020; --red:#ff5c5c;
    --blue:#5b8def; --purple:#a78bfa; --cyan:#38bdf8;
    --track:#232833;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;min-height:100vh;-webkit-text-size-adjust:100%}
  body{padding:20px}
  .app{max-width:1120px;margin:0 auto}

  header{display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:16px;flex-wrap:wrap;gap:10px}
  h1{font-size:18px;font-weight:700;letter-spacing:.5px}
  .clock{font-family:Consolas,monospace;color:var(--dim);font-size:12px}

  .card{background:var(--card);border:1px solid var(--edge);
    border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card-title{color:var(--dim);font-size:11px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}

  /* 大号 FPS */
  .bigfps{display:flex;align-items:baseline;gap:14px;padding:6px 0 12px}
  .bigfps .num{font-family:Consolas,monospace;font-size:64px;
    font-weight:700;line-height:1;color:var(--green);
    transition:color .3s ease;font-variant-numeric:tabular-nums}
  .bigfps .unit{font-size:20px;color:var(--dim);font-weight:600}
  .bigfps .frame{font-family:Consolas,monospace;font-size:14px;
    color:var(--faint);margin-left:auto;text-align:right;line-height:1.6}
  @media (max-width:600px){
    .bigfps .num{font-size:44px}
    .bigfps .unit{font-size:15px}
    .bigfps .frame{font-size:11px}
  }

  /* 图表 */
  .chart-wrap{position:relative;width:100%;height:220px}
  canvas#chart{display:block;width:100%;height:100%}
  @media (max-width:600px){.chart-wrap{height:170px}}

  /* 统计网格 */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
  @media (max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--bg);border:1px solid var(--edge);
    border-radius:8px;padding:8px 10px}
  .stat .k{color:var(--faint);font-size:10px;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .stat .v{font-family:Consolas,monospace;font-size:16px;
    font-weight:700;font-variant-numeric:tabular-nums}
  .stat.green .v{color:var(--green)}
  .stat.yellow .v{color:var(--yellow)}
  .stat.red .v{color:var(--red)}
  .stat.blue .v{color:var(--blue)}
  .stat.cyan .v{color:var(--cyan)}
  .stat.purple .v{color:var(--purple)}

  /* 控制栏 */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{padding:9px 18px;border-radius:8px;border:1px solid var(--edge);
    background:var(--card);color:var(--text);cursor:pointer;
    font-size:12px;font-weight:600;font-family:inherit;
    transition:all .15s ease;display:inline-flex;
    align-items:center;gap:6px}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.primary:hover{background:#4a7de0;color:#fff}
  .btn.danger{border-color:var(--edge);color:var(--red)}
  .btn.danger:hover{border-color:var(--red);background:rgba(255,92,92,.1)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--edge);color:var(--text)}

  .info{color:var(--faint);font-size:11px;margin-left:auto;
    font-family:Consolas,monospace}

  /* 提示 */
  .tip{color:var(--faint);font-size:11px;margin-top:8px;
    line-height:1.6}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%)
      translateY(80px);background:var(--blue);color:#fff;
    padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;
    transition:transform .3s ease;z-index:100;pointer-events:none;
    box-shadow:0 4px 20px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>实时帧率监控</h1>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <!-- 大号数字 -->
  <div class="card">
    <div class="bigfps">
      <div class="num" id="bigfps">--</div>
      <div class="unit">FPS</div>
      <div class="frame">
        <div>帧耗时 <span id="frametime">--</span> ms</div>
        <div>已记录 <span id="framecount">0</span> 帧 · <span id="duration">0.0</span>s</div>
      </div>
    </div>
  </div>

  <!-- 折线图 -->
  <div class="card">
    <div class="card-title">帧率曲线 · 最近 60 秒</div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <!-- 统计 -->
  <div class="card">
    <div class="card-title">统计</div>
    <div class="stats">
      <div class="stat green"><div class="k">平均 FPS</div><div class="v" id="s-avg">--</div></div>
      <div class="stat yellow"><div class="k">最低 FPS</div><div class="v" id="s-min">--</div></div>
      <div class="stat blue"><div class="k">最高 FPS</div><div class="v" id="s-max">--</div></div>
      <div class="stat cyan"><div class="k">1% Low</div><div class="v" id="s-p1">--</div></div>
      <div class="stat purple"><div class="k">0.1% Low</div><div class="v" id="s-p01">--</div></div>
      <div class="stat red"><div class="k">卡顿次数</div><div class="v" id="s-stut">--</div></div>
    </div>
    <div class="tip">
      1% Low / 0.1% Low = 最差 1%/0.1% 帧的平均 FPS，反映卡顿感，越低越卡。<br>
      卡顿 = 该帧耗时超过平均帧耗时的 2 倍。
    </div>
  </div>

  <!-- 控制栏 -->
  <div class="card">
    <div class="controls">
      <button class="btn primary" id="btn-toggle">开始记录</button>
      <button class="btn" id="btn-export" disabled>导出 CSV</button>
      <button class="btn danger" id="btn-reset">清空</button>
      <div class="info" id="info">未开始</div>
    </div>
    <div class="tip">
      CSV 包含每帧的时间戳、帧耗时、瞬时 FPS，可用 Excel / Python 分析。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- 状态 ----------
  var recording = false;
  var samples = [];        // 每帧: {t: performance.now, dt: ms, fps: 瞬时}
  var startTime = 0;
  var lastFrameT = 0;

  // 滚动窗口（图表用）
  var HISTORY = 300;       // 300 点 = 60 秒 @ 200ms 采样
  var rollFps = new Array(HISTORY).fill(0);
  var lastChartPush = 0;
  var CHART_INTERVAL = 200; // 每 200ms 推一个点进图表

  // 当前瞬时
  var curFps = 0;
  var curDt = 0;

  // 平滑用
  var fpsBuffer = [];
  var FPS_SMOOTH_WINDOW = 10;  // 10 帧滑动平均，显示更稳

  // ---------- 工具 ----------
  function pad(n){ return String(n).padStart(2, '0'); }
  function setText(id, t){ var e = document.getElementById(id); if (e) e.textContent = t; }
  function fmt(n, d){ return Number.isFinite(n) ? n.toFixed(d) : '--'; }

  function showToast(msg, color){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = color || 'var(--blue)';
    t.classList.add('show');
    clearTimeout(showToast._tid);
    showToast._tid = setTimeout(function(){
      t.classList.remove('show');
    }, 1800);
  }

  // ---------- 折线图 ----------
  var chart = document.getElementById('chart');
  var ctx = chart.getContext('2d');

  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    var rect = chart.getBoundingClientRect();
    chart.width  = Math.floor(rect.width  * dpr);
    chart.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  function drawChart(){
    var dpr = window.devicePixelRatio || 1;
    var w = chart.width / dpr, h = chart.height / dpr;
    ctx.clearRect(0, 0, w, h);

    var padL = 34, padT = 14, padR = 12, padB = 20;
    var x0 = padL, y0 = padT, x1 = w - padR, y1 = h - padB;
    var cw = x1 - x0, ch = y1 - y0;

    // 动态 Y 轴上限（向上取整到 60 的倍数，最小 60）
    var maxFps = 60;
    for (var i = 0; i < rollFps.length; i++){
      if (rollFps[i] > maxFps) maxFps = rollFps[i];
    }
    maxFps = Math.ceil(maxFps / 30) * 30;
    if (maxFps < 60) maxFps = 60;

    // 网格 + Y 轴刻度
    ctx.strokeStyle = '#1c2028';
    ctx.fillStyle = '#4b5261';
    ctx.font = '10px Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    var steps = 4;
    for (var i = 0; i <= steps; i++){
      var v = maxFps * i / steps;
      var y = y1 - ch * i / steps;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.fillText(Math.round(v), x0 - 5, y);
    }

    // 60 FPS 参考线（如果 maxFps > 60）
    if (maxFps > 60){
      var y60 = y1 - ch * 60 / maxFps;
      ctx.strokeStyle = 'rgba(61,220,132,.25)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x0, y60); ctx.lineTo(x1, y60); ctx.stroke();
      ctx.setLineDash([]);
    }

    // 曲线
    var lastVal = rollFps[0];
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';

    // 分段着色：低于 30 红，30~55 黄，55+ 绿
    for (var i = 1; i < rollFps.length; i++){
      var v0 = rollFps[i - 1], v1 = rollFps[i];
      var xa = x0 + cw * (i - 1) / (rollFps.length - 1);
      var xb = x0 + cw * i / (rollFps.length - 1);
      var ya = y1 - ch * Math.min(v0, maxFps) / maxFps;
      var yb = y1 - ch * Math.min(v1, maxFps) / maxFps;

      var avg = (v0 + v1) / 2;
      var color = avg >= 55 ? '#3ddc84' : avg >= 30 ? '#ffb020' : '#ff5c5c';
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(xa, ya);
      ctx.lineTo(xb, yb);
      ctx.stroke();
    }

    // 顶部渐变填充
    ctx.beginPath();
    ctx.moveTo(x0, y1);
    for (var i = 0; i < rollFps.length; i++){
      var x = x0 + cw * i / (rollFps.length - 1);
      var y = y1 - ch * Math.min(rollFps[i], maxFps) / maxFps;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x1, y1);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0, y0, 0, y1);
    grad.addColorStop(0, 'rgba(61,220,132,.18)');
    grad.addColorStop(1, 'rgba(61,220,132,0)');
    ctx.fillStyle = grad;
    ctx.fill();

    // 右上角信息
    ctx.font = '10px Consolas, monospace';
    ctx.fillStyle = '#4b5261';
    ctx.textAlign = 'right';
    ctx.fillText('MAX ' + maxFps, x1 - 4, y0 + 6);
  }

  // ---------- 帧循环 ----------
  function frameLoop(t){
    if (lastFrameT === 0){
      lastFrameT = t;
      requestAnimationFrame(frameLoop);
      return;
    }

    var dt = t - lastFrameT;
    lastFrameT = t;

    // 过滤异常值（暂停标签页回来会很大）
    if (dt > 500) dt = 500;
    if (dt < 0.1) dt = 0.1;

    var fps = 1000 / dt;
    curDt = dt;

    // 平滑显示
    fpsBuffer.push(fps);
    if (fpsBuffer.length > FPS_SMOOTH_WINDOW) fpsBuffer.shift();
    var sum = 0;
    for (var i = 0; i < fpsBuffer.length; i++) sum += fpsBuffer[i];
    curFps = sum / fpsBuffer.length;

    // 记录
    if (recording){
      samples.push({
        t: performance.now() - startTime,   // 相对时间 ms
        dt: dt,
        fps: fps
      });
    }

    // 每 200ms 推一个点进图表
    if (t - lastChartPush >= CHART_INTERVAL){
      rollFps.push(curFps);
      if (rollFps.length > HISTORY) rollFps.shift();
      lastChartPush = t;

      // 更新 UI
      updateUI();
      drawChart();
    }

    requestAnimationFrame(frameLoop);
  }

  // ---------- UI 更新 ----------
  function fpsColor(f){
    if (f >= 55) return 'var(--green)';
    if (f >= 30) return 'var(--yellow)';
    return 'var(--red)';
  }

  function updateUI(){
    setText('bigfps', Math.round(curFps));
    document.getElementById('bigfps').style.color = fpsColor(curFps);
    setText('frametime', curDt.toFixed(2));
    setText('framecount', samples.length.toLocaleString());
    var dur = recording ? (performance.now() - startTime) / 1000 : 0;
    setText('duration', dur.toFixed(1));

    var t = new Date();
    setText('clock', pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()));

    // 统计（只用已记录的样本）
    if (samples.length > 0){
      var fpsArr = samples.map(function(s){ return s.fps; }).slice().sort(function(a,b){ return a-b; });
      var n = fpsArr.length;
      var sum = 0;
      for (var i = 0; i < n; i++) sum += fpsArr[i];
      var avg = sum / n;
      var min = fpsArr[0];
      var max = fpsArr[n - 1];

      // 1% / 0.1% low：取最差的部分的平均值
      var cnt1 = Math.max(1, Math.floor(n * 0.01));
      var cnt01 = Math.max(1, Math.floor(n * 0.001));
      var sum1 = 0, sum01 = 0;
      for (var i = 0; i < cnt1; i++) sum1 += fpsArr[i];
      for (var i = 0; i < cnt01; i++) sum01 += fpsArr[i];
      var p1 = sum1 / cnt1;
      var p01 = sum01 / cnt01;

      // 卡顿：帧耗时 > 2 倍平均
      var avgDt = 1000 / avg;
      var stutters = 0;
      for (var i = 0; i < n; i++){
        if (samples[i].dt > avgDt * 2) stutters++;
      }

      setText('s-avg', fmt(avg, 1));
      setText('s-min', fmt(min, 1));
      setText('s-max', fmt(max, 1));
      setText('s-p1', fmt(p1, 1));
      setText('s-p01', fmt(p01, 1));
      setText('s-stut', stutters);
    } else {
      ['s-avg','s-min','s-max','s-p1','s-p01','s-stut'].forEach(function(id){
        setText(id, '--');
      });
    }

    // 状态
    if (recording){
      setText('info', '● 记录中 · ' + samples.length + ' 帧');
      document.getElementById('info').style.color = 'var(--green)';
    } else {
      setText('info', samples.length > 0 ? '已停止' : '未开始');
      document.getElementById('info').style.color = 'var(--faint)';
    }
  }

  // ---------- 按钮 ----------
  var btnToggle = document.getElementById('btn-toggle');
  var btnExport = document.getElementById('btn-export');
  var btnReset  = document.getElementById('btn-reset');

  btnToggle.onclick = function(){
    if (!recording){
      recording = true;
      startTime = performance.now();
      samples = [];
      btnToggle.textContent = '停止记录';
      btnToggle.classList.remove('primary');
      btnToggle.classList.add('danger');
      btnExport.disabled = true;
      showToast('开始记录', 'var(--green)');
    } else {
      recording = false;
      btnToggle.textContent = '开始记录';
      btnToggle.classList.remove('danger');
      btnToggle.classList.add('primary');
      btnExport.disabled = samples.length === 0;
      showToast('已停止 · ' + samples.length + ' 帧', 'var(--yellow)');
    }
  };

  btnReset.onclick = function(){
    recording = false;
    samples = [];
    fpsBuffer = [];
    rollFps = new Array(HISTORY).fill(0);
    curFps = 0;
    lastChartPush = 0;
    btnToggle.textContent = '开始记录';
    btnToggle.classList.remove('danger');
    btnToggle.classList.add('primary');
    btnExport.disabled = true;
    updateUI();
    drawChart();
    showToast('已清空', 'var(--red)');
  };

  btnExport.onclick = function(){
    if (samples.length === 0){
      showToast('没有数据', 'var(--red)');
      return;
    }

    // CSV 头
    var lines = ['timestamp_ms,frametime_ms,fps'];

    // 每帧一行
    for (var i = 0; i < samples.length; i++){
      var s = samples[i];
      lines.push(s.t.toFixed(2) + ',' + s.dt.toFixed(3) + ',' + s.fps.toFixed(2));
    }

    var csv = lines.join('\r\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = new Date();
    var name = 'fps_' +
      ts.getFullYear() +
      pad(ts.getMonth() + 1) +
      pad(ts.getDate()) + '_' +
      pad(ts.getHours()) +
      pad(ts.getMinutes()) +
      pad(ts.getSeconds()) + '.csv';
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

    showToast('已导出 ' + samples.length + ' 帧', 'var(--blue)');
  };

  // ---------- 启动 ----------
  window.addEventListener('load', function(){
    resizeCanvas();
    drawChart();
    updateUI();
    lastFrameT = 0;
    requestAnimationFrame(frameLoop);
  });

})();
</script>
</body>
</html>
