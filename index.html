<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<title>实时帧率监控</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --edge:#232833;
    --text:#e6e8ec; --dim:#8b93a7; --faint:#4b5261;
    --green:#3ddc84; --yellow:#ffb020; --red:#ff5c5c;
    --blue:#5b8def; --purple:#a78bfa; --cyan:#38bdf8;
    --track:#232833;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;min-height:100vh;-webkit-text-size-adjust:100%}
  body{padding:16px}
  .app{max-width:1120px;margin:0 auto}

  header{display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:14px;flex-wrap:wrap;gap:8px}
  h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  .clock{font-family:Consolas,monospace;color:var(--dim);font-size:12px}

  .card{background:var(--card);border:1px solid var(--edge);
    border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .card-title{color:var(--dim);font-size:11px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}

  .bigfps{display:flex;align-items:baseline;gap:14px;padding:4px 0 10px;flex-wrap:wrap}
  .bigfps .num{font-family:Consolas,monospace;font-size:56px;
    font-weight:700;line-height:1;color:var(--green);
    transition:color .3s ease;font-variant-numeric:tabular-nums}
  .bigfps .unit{font-size:18px;color:var(--dim);font-weight:600}
  .bigfps .frame{font-family:Consolas,monospace;font-size:12px;
    color:var(--faint);margin-left:auto;text-align:right;line-height:1.6}

  .chart-wrap{position:relative;width:100%;height:200px}
  canvas#chart{display:block;width:100%;height:100%}

  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .stat{background:var(--bg);border:1px solid var(--edge);
    border-radius:8px;padding:8px 10px}
  .stat .k{color:var(--faint);font-size:10px;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .stat .v{font-family:Consolas,monospace;font-size:15px;
    font-weight:700;font-variant-numeric:tabular-nums}
  .stat.green .v{color:var(--green)}
  .stat.yellow .v{color:var(--yellow)}
  .stat.red .v{color:var(--red)}
  .stat.blue .v{color:var(--blue)}
  .stat.cyan .v{color:var(--cyan)}
  .stat.purple .v{color:var(--purple)}

  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{padding:9px 14px;border-radius:8px;border:1px solid var(--edge);
    background:var(--card);color:var(--text);cursor:pointer;
    font-size:12px;font-weight:600;font-family:inherit;
    transition:all .15s ease;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.primary:hover{background:#4a7de0;color:#fff}
  .btn.danger{border-color:var(--edge);color:var(--red)}
  .btn.danger:hover{border-color:var(--red);background:rgba(255,92,92,.1)}
  .btn.active{background:var(--green);color:#0f1115;border-color:var(--green)}
  .btn.active:hover{background:var(--green);color:#0f1115}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--edge);color:var(--text)}

  .info{color:var(--faint);font-size:11px;margin-left:auto;
    font-family:Consolas,monospace}

  .tip{color:var(--faint);font-size:11px;margin-top:8px;line-height:1.6}

  .toast{position:fixed;left:50%;bottom:30px;
    transform:translateX(-50%) translateY(80px);
    background:var(--blue);color:#fff;
    padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;
    transition:transform .3s ease;z-index:100;pointer-events:none;
    box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:600px){
    body{padding:10px}
    h1{font-size:15px}
    .card{padding:10px 12px;border-radius:10px}
    .chart-wrap{height:160px}
    .bigfps .num{font-size:40px}
    .bigfps .unit{font-size:14px}
    .bigfps .frame{font-size:11px;margin-left:0;width:100%;text-align:left}
    .stats{grid-template-columns:repeat(2,1fr)}
    .info{width:100%;margin-left:0;margin-top:6px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>实时帧率监控</h1>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="card">
    <div class="bigfps">
      <div class="num" id="bigfps">--</div>
      <div class="unit">FPS</div>
      <div class="frame">
        <div>帧耗时 <span id="frametime">--</span> ms</div>
        <div>已记录 <span id="framecount">0</span> 帧 · <span id="duration">0.0</span>s</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">帧率曲线 · 最近 60 秒</div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">统计</div>
    <div class="stats">
      <div class="stat green"><div class="k">平均 FPS</div><div class="v" id="s-avg">--</div></div>
      <div class="stat yellow"><div class="k">最低 FPS</div><div class="v" id="s-min">--</div></div>
      <div class="stat blue"><div class="k">最高 FPS</div><div class="v" id="s-max">--</div></div>
      <div class="stat cyan"><div class="k">1% Low</div><div class="v" id="s-p1">--</div></div>
      <div class="stat purple"><div class="k">0.1% Low</div><div class="v" id="s-p01">--</div></div>
      <div class="stat red"><div class="k">卡顿次数</div><div class="v" id="s-stut">--</div></div>
    </div>
    <div class="tip">
      1% Low / 0.1% Low = 最差 1% / 0.1% 帧的平均 FPS，反映卡顿感。卡顿 = 帧耗时 &gt; 平均的 2 倍。
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <button class="btn primary" id="btn-toggle">开始记录</button>
      <button class="btn" id="btn-export" disabled>导出 CSV</button>
      <button class="btn" id="btn-wake">☀ 屏幕常亮</button>
      <button class="btn danger" id="btn-reset">清空</button>
      <div class="info" id="info">未开始</div>
    </div>
    <div class="tip">
      <b>屏幕常亮</b>：防止测试时自动熄屏。切换标签页/锁屏后 Wake Lock 会自动释放，切回页面需重新点击开启。<br>
      切后台期间 <b>自动暂停记录</b>，恢复后从新的一段开始，导出 CSV 会按 segment 分段。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ==================== 状态 ====================
  var recording = false;
  var samples = [];        // {segment, t, dt, fps}
  var segment = 0;         // 当前段号
  var startTime = 0;       // 本段起点（performance.now）
  var lastFrameT = 0;

  var HISTORY = 300;
  var rollFps = new Array(HISTORY).fill(0);
  var lastChartPush = 0;
  var CHART_INTERVAL = 200;

  var curFps = 0, curDt = 0;
  var fpsBuffer = [];
  var FPS_SMOOTH_WINDOW = 10;

  // ==================== 工具 ====================
  function pad(n){ return String(n).padStart(2, '0'); }
  function setText(id, t){ var e = document.getElementById(id); if (e) e.textContent = t; }
  function fmt(n, d){ return Number.isFinite(n) ? n.toFixed(d) : '--'; }
  function now(){ return performance.now(); }

  function showToast(msg, color){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = color || 'var(--blue)';
    t.classList.add('show');
    clearTimeout(showToast._tid);
    showToast._tid = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  // ==================== Wake Lock ====================
  var wakeLock = null;
  var wakeWanted = false;   // 用户是否想开启

  async function requestWakeLock(){
    if (!('wakeLock' in navigator)){
      showToast('此浏览器不支持屏幕常亮', 'var(--red)');
      return false;
    }
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){
        // 系统自动释放（比如切后台），只提示不改变 wakeWanted
        if (wakeWanted) console.log('Wake Lock 被释放（可能在后台）');
      });
      console.log('✓ 屏幕常亮已开启');
      return true;
    }catch(e){
      console.warn('无法开启屏幕常亮:', e);
      showToast('无法开启屏幕常亮：' + e.message, 'var(--red)');
      return false;
    }
  }

  async function releaseWakeLock(){
    if (wakeLock){
      try{ await wakeLock.release(); }catch(e){}
      wakeLock = null;
    }
  }

  // 用户点击开关
  document.getElementById('btn-wake').onclick = async function(){
    var btn = this;
    if (!wakeWanted){
      // 开启
      wakeWanted = true;
      var ok = await requestWakeLock();
      if (ok){
        btn.classList.add('active');
        btn.textContent = '☀ 常亮中';
        showToast('屏幕常亮已开启', 'var(--green)');
      } else {
        wakeWanted = false;
      }
    } else {
      // 关闭
      wakeWanted = false;
      await releaseWakeLock();
      btn.classList.remove('active');
      btn.textContent = '☀ 屏幕常亮';
      showToast('屏幕常亮已关闭', 'var(--yellow)');
    }
  };

  // ==================== 页面可见性 ====================
  var hiddenAt = 0;

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      // 进后台：记录时间点，暂停采样
      if (recording){
        hiddenAt = now();
        console.log('→ 页面隐藏，暂停记录');
      }
    } else {
      // 回前台：跳过空档，开新段
      if (recording && hiddenAt > 0){
        var gap = now() - hiddenAt;
        segment++;
        startTime = now();
        lastFrameT = 0;        // 重置帧计时，第一帧不会爆表
        fpsBuffer = [];
        hiddenAt = 0;
        console.log('← 页面恢复，新段 #' + segment + '，跳过 ' + (gap/1000).toFixed(1) + 's');
        showToast('已跳过后台 ' + (gap/1000).toFixed(1) + 's，新段 #' + segment, 'var(--yellow)');
      }
      // 恢复屏幕常亮
      if (wakeWanted && !wakeLock){
        requestWakeLock().then(function(ok){
          if (!ok){
            // 浏览器拒绝（可能没用户手势），把按钮状态回退
            wakeWanted = false;
            var btn = document.getElementById('btn-wake');
            btn.classList.remove('active');
            btn.textContent = '☀ 屏幕常亮';
          }
        });
      }
    }
  });

  // ==================== 折线图 ====================
  var chart = document.getElementById('chart');
  var ctx = chart.getContext('2d');

  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    var rect = chart.getBoundingClientRect();
    chart.width  = Math.floor(rect.width  * dpr);
    chart.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  function drawChart(){
    var dpr = window.devicePixelRatio || 1;
    var w = chart.width / dpr, h = chart.height / dpr;
    ctx.clearRect(0, 0, w, h);

    var padL = 34, padT = 14, padR = 12, padB = 20;
    var x0 = padL, y0 = padT, x1 = w - padR, y1 = h - padB;
    var cw = x1 - x0, ch = y1 - y0;

    var maxFps = 60;
    for (var i = 0; i < rollFps.length; i++){
      if (rollFps[i] > maxFps) maxFps = rollFps[i];
    }
    maxFps = Math.ceil(maxFps / 30) * 30;
    if (maxFps < 60) maxFps = 60;

    // 网格
    ctx.strokeStyle = '#1c2028';
    ctx.fillStyle = '#4b5261';
    ctx.font = '10px Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    var steps = 4;
    for (var i = 0; i <= steps; i++){
      var v = maxFps * i / steps;
      var y = y1 - ch * i / steps;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.fillText(Math.round(v), x0 - 5, y);
    }

    if (maxFps > 60){
      var y60 = y1 - ch * 60 / maxFps;
      ctx.strokeStyle = 'rgba(61,220,132,.25)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x0, y60); ctx.lineTo(x1, y60); ctx.stroke();
      ctx.setLineDash([]);
    }

    // 曲线分段染色
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    for (var i = 1; i < rollFps.length; i++){
      var v0 = rollFps[i-1], v1 = rollFps[i];
      var xa = x0 + cw * (i-1) / (rollFps.length-1);
      var xb = x0 + cw * i / (rollFps.length-1);
      var ya = y1 - ch * Math.min(v0, maxFps) / maxFps;
      var yb = y1 - ch * Math.min(v1, maxFps) / maxFps;
      var avg = (v0 + v1) / 2;
      ctx.strokeStyle = avg >= 55 ? '#3ddc84' : avg >= 30 ? '#ffb020' : '#ff5c5c';
      ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();
    }

    // 填充
    ctx.beginPath();
    ctx.moveTo(x0, y1);
    for (var i = 0; i < rollFps.length; i++){
      var x = x0 + cw * i / (rollFps.length-1);
      var y = y1 - ch * Math.min(rollFps[i], maxFps) / maxFps;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x1, y1); ctx.closePath();
    var grad = ctx.createLinearGradient(0, y0, 0, y1);
    grad.addColorStop(0, 'rgba(61,220,132,.18)');
    grad.addColorStop(1, 'rgba(61,220,132,0)');
    ctx.fillStyle = grad; ctx.fill();

    ctx.font = '10px Consolas, monospace';
    ctx.fillStyle = '#4b5261';
    ctx.textAlign = 'right';
    ctx.fillText('MAX ' + maxFps, x1 - 4, y0 + 6);
  }

  // ==================== 帧循环 ====================
  function frameLoop(t){
    if (lastFrameT === 0){
      lastFrameT = t;
      requestAnimationFrame(frameLoop);
      return;
    }
    var dt = t - lastFrameT;
    lastFrameT = t;
    if (dt > 500) dt = 500;
    if (dt < 0.1) dt = 0.1;

    var fps = 1000 / dt;
    curDt = dt;

    fpsBuffer.push(fps);
    if (fpsBuffer.length > FPS_SMOOTH_WINDOW) fpsBuffer.shift();
    var sum = 0;
    for (var i = 0; i < fpsBuffer.length; i++) sum += fpsBuffer[i];
    curFps = sum / fpsBuffer.length;

    if (recording){
      samples.push({
        segment: segment,
        t: now() - startTime,
        dt: dt,
        fps: fps
      });
    }

    if (t - lastChartPush >= CHART_INTERVAL){
      rollFps.push(curFps);
      if (rollFps.length > HISTORY) rollFps.shift();
      lastChartPush = t;
      updateUI();
      drawChart();
    }
    requestAnimationFrame(frameLoop);
  }

  // ==================== UI ====================
  function fpsColor(f){
    if (f >= 55) return 'var(--green)';
    if (f >= 30) return 'var(--yellow)';
    return 'var(--red)';
  }

  function updateUI(){
    setText('bigfps', Math.round(curFps));
    document.getElementById('bigfps').style.color = fpsColor(curFps);
    setText('frametime', curDt.toFixed(2));
    setText('framecount', samples.length.toLocaleString());
    var dur = recording ? (now() - startTime) / 1000 : 0;
    setText('duration', dur.toFixed(1));

    var t = new Date();
    setText('clock', pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()));

    if (samples.length > 0){
      var fpsArr = samples.map(function(s){ return s.fps; }).sort(function(a,b){ return a-b; });
      var n = fpsArr.length;
      var sum = 0;
      for (var i = 0; i < n; i++) sum += fpsArr[i];
      var avg = sum / n;
      var min = fpsArr[0];
      var max = fpsArr[n-1];

      var cnt1  = Math.max(1, Math.floor(n * 0.01));
      var cnt01 = Math.max(1, Math.floor(n * 0.001));
      var sum1 = 0, sum01 = 0;
      for (var i = 0; i < cnt1;  i++) sum1  += fpsArr[i];
      for (var i = 0; i < cnt01; i++) sum01 += fpsArr[i];
      var p1 = sum1 / cnt1, p01 = sum01 / cnt01;

      var avgDt = 1000 / avg;
      var stutters = 0;
      for (var i = 0; i < n; i++){
        if (samples[i].dt > avgDt * 2) stutters++;
      }

      setText('s-avg', fmt(avg, 1));
      setText('s-min', fmt(min, 1));
      setText('s-max', fmt(max, 1));
      setText('s-p1', fmt(p1, 1));
      setText('s-p01', fmt(p01, 1));
      setText('s-stut', stutters);
    } else {
      ['s-avg','s-min','s-max','s-p1','s-p01','s-stut'].forEach(function(id){
        setText(id, '--');
      });
    }

    if (recording){
      setText('info', '● 记录中 · 段#' + segment + ' · ' + samples.length + ' 帧');
      document.getElementById('info').style.color = 'var(--green)';
    } else {
      setText('info', samples.length > 0 ? '已停止' : '未开始');
      document.getElementById('info').style.color = 'var(--faint)';
    }
  }

  // ==================== 按钮 ====================
  var btnToggle = document.getElementById('btn-toggle');
  var btnExport = document.getElementById('btn-export');
  var btnReset  = document.getElementById('btn-reset');

  btnToggle.onclick = function(){
    if (!recording){
      recording = true;
      segment = 1;
      startTime = now();
      lastFrameT = 0;
      samples = [];
      fpsBuffer = [];
      btnToggle.textContent = '停止记录';
      btnToggle.classList.remove('primary');
      btnToggle.classList.add('danger');
      btnExport.disabled = true;
      // 顺手请求常亮（用户点击了，满足 user activation）
      if (!wakeWanted){
        // 不自动开启，只提示用户
      }
      showToast('开始记录', 'var(--green)');
    } else {
      recording = false;
      btnToggle.textContent = '开始记录';
      btnToggle.classList.remove('danger');
      btnToggle.classList.add('primary');
      btnExport.disabled = samples.length === 0;
      showToast('已停止 · ' + samples.length + ' 帧', 'var(--yellow)');
    }
  };

  btnReset.onclick = function(){
    recording = false;
    samples = [];
    segment = 0;
    fpsBuffer = [];
    rollFps = new Array(HISTORY).fill(0);
    curFps = 0;
    lastChartPush = 0;
    lastFrameT = 0;
    btnToggle.textContent = '开始记录';
    btnToggle.classList.remove('danger');
    btnToggle.classList.add('primary');
    btnExport.disabled = true;
    updateUI();
    drawChart();
    showToast('已清空', 'var(--red)');
  };

  btnExport.onclick = function(){
    if (samples.length === 0){ showToast('没有数据', 'var(--red)'); return; }

    var lines = ['segment,timestamp_ms,frametime_ms,fps'];
    for (var i = 0; i < samples.length; i++){
      var s = samples[i];
      lines.push(s.segment + ',' + s.t.toFixed(2) + ',' +
                 s.dt.toFixed(3) + ',' + s.fps.toFixed(2));
    }

    var csv = lines.join('\r\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = new Date();
    var name = 'fps_' + ts.getFullYear() + pad(ts.getMonth()+1) + pad(ts.getDate()) +
               '_' + pad(ts.getHours()) + pad(ts.getMinutes()) + pad(ts.getSeconds()) + '.csv';
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('已导出 ' + samples.length + ' 帧', 'var(--blue)');
  };

  // ==================== 启动 ====================
  window.addEventListener('load', function(){
    resizeCanvas();
    drawChart();
    updateUI();
    lastFrameT = 0;
    requestAnimationFrame(frameLoop);
  });

})();
</script>
</body>
</html>
