<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<title>系统信息 · 浏览器版</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --edge:#232833;
    --text:#e6e8ec; --dim:#8b93a7; --faint:#4b5261;
    --green:#3ddc84; --yellow:#ffb020; --red:#ff5c5c;
    --blue:#5b8def; --purple:#a78bfa; --cyan:#38bdf8;
    --track:#232833;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;min-height:100vh;-webkit-text-size-adjust:100%}
  body{padding:16px}
  .app{max-width:1120px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  .clock{font-family:Consolas,monospace;color:var(--dim);font-size:12px}
  .sub{color:var(--faint);font-size:11px;margin-bottom:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .card{
    background:var(--card);border:1px solid var(--edge);
    border-radius:12px;padding:12px 14px;margin-bottom:10px;
  }
  .card-title{
    color:var(--dim);font-size:11px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
  }
  .chart-wrap{position:relative;width:100%;height:150px}
  canvas#chart{display:block;width:100%;height:100%}

  .metric{display:flex;align-items:center;gap:8px;padding:3px 0}
  .metric .label{color:var(--dim);min-width:78px;font-size:12px}
  .metric .bar{flex:1;height:8px;background:var(--track);
    border-radius:4px;overflow:hidden}
  .metric .bar-fill{height:100%;border-radius:4px;width:0;
    background:var(--green);transition:width .3s ease,background-color .3s ease}
  .metric .value{font-family:Consolas,monospace;font-size:12px;
    font-weight:700;min-width:66px;text-align:right}

  .io-row{display:flex;align-items:center;justify-content:space-between;
    padding:4px 0;font-size:12px;gap:10px}
  .io-label{color:var(--dim);white-space:nowrap}
  .io-value{font-family:Consolas,monospace;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-align:right;max-width:380px}
  .divider{height:1px;background:var(--edge);margin:6px 0}

  .grid{display:grid;grid-template-columns:380px 1fr;gap:10px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}

  .mem-info{font-family:Consolas,monospace;font-size:11px;
    color:var(--faint);margin-top:5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  .empty{color:var(--faint);font-size:11px;font-style:italic}

  @media (max-width:600px){
    body{padding:10px}
    h1{font-size:15px}
    .card{padding:10px 12px;border-radius:10px}
    .chart-wrap{height:130px}
    .metric .label{min-width:66px;font-size:11px}
    .metric .value{min-width:52px;font-size:11px}
    .metric .bar{height:7px}
    .io-row{font-size:11px}
    .io-value{max-width:180px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>系统信息</h1>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <div class="sub" id="sub">加载中...</div>

  <div class="card">
    <div class="card-title">实时性能 · 最近 60 秒</div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="card-title">页面性能</div>
        <div class="metric" id="fps-row">
          <div class="label">帧率</div>
          <div class="bar"><div class="bar-fill"></div></div>
          <div class="value">--</div>
        </div>
        <div class="metric" id="heap-row">
          <div class="label">JS 堆内存</div>
          <div class="bar"><div class="bar-fill"></div></div>
          <div class="value">--</div>
        </div>
        <div class="mem-info" id="heap-info">--</div>
      </div>

      <div class="card">
        <div class="card-title">电池</div>
        <div class="metric" id="batt-row">
          <div class="label">电量</div>
          <div class="bar"><div class="bar-fill"></div></div>
          <div class="value">--</div>
        </div>
        <div class="mem-info" id="batt-info">读取中...</div>
      </div>

      <div class="card">
        <div class="card-title">网络</div>
        <div class="io-row">
          <div class="io-label">类型</div>
          <div class="io-value" id="net-type">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">估算下行</div>
          <div class="io-value" id="net-down">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">RTT</div>
          <div class="io-value" id="net-rtt">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">省流模式</div>
          <div class="io-value" id="net-save">--</div>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-title">硬件</div>
        <div class="io-row">
          <div class="io-label">逻辑核心</div>
          <div class="io-value" id="hw-cores">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">内存</div>
          <div class="io-value" id="hw-mem">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">GPU</div>
          <div class="io-value" id="hw-gpu">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">屏幕</div>
          <div class="io-value" id="hw-screen">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">像素比</div>
          <div class="io-value" id="hw-dpr">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">触屏</div>
          <div class="io-value" id="hw-touch">--</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">存储配额</div>
        <div class="metric" id="store-row">
          <div class="label">已用</div>
          <div class="bar"><div class="bar-fill"></div></div>
          <div class="value">--</div>
        </div>
        <div class="mem-info" id="store-info">读取中...</div>
      </div>

      <div class="card">
        <div class="card-title">浏览器</div>
        <div class="io-row">
          <div class="io-label">UA</div>
          <div class="io-value" id="br-ua" style="font-size:11px">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">语言</div>
          <div class="io-value" id="br-lang">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">时区</div>
          <div class="io-value" id="br-tz">--</div>
        </div>
        <div class="io-row">
          <div class="io-label">在线</div>
          <div class="io-value" id="br-online">--</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- 工具 ----------
  var COLORS = { green:'#3ddc84', yellow:'#ffb020', red:'#ff5c5c' };
  function usageColor(p){
    if (p < 60) return COLORS.green;
    if (p < 85) return COLORS.yellow;
    return COLORS.red;
  }
  function fpsColor(fps){
    if (fps >= 55) return COLORS.green;
    if (fps >= 30) return COLORS.yellow;
    return COLORS.red;
  }
  function setBar(root, percent, text, color){
    if (!root) return;
    var fill = root.querySelector('.bar-fill');
    var val  = root.querySelector('.value');
    var p = Math.max(0, Math.min(100, percent));
    fill.style.width = p + '%';
    fill.style.background = color || usageColor(p);
    val.textContent = (text != null) ? text : p.toFixed(1) + '%';
  }
  function setText(id, text){
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }
  function setHTML(id, html){
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }
  function pad(n){ return String(n).padStart(2, '0'); }

  // ---------- 浏览器识别 ----------
  function detectBrowser(){
    var ua = navigator.userAgent;
    if (ua.indexOf('Edg/') > -1) return 'Edge';
    if (ua.indexOf('OPR/') > -1) return 'Opera';
    if (ua.indexOf('Chrome/') > -1) return 'Chrome';
    if (ua.indexOf('Firefox/') > -1) return 'Firefox';
    if (ua.indexOf('Safari/') > -1) return 'Safari';
    return '浏览器';
  }
  function detectOS(){
    var ua = navigator.userAgent;
    if (/Windows NT 10/.test(ua)) return 'Windows 10/11';
    if (/Windows NT/.test(ua)) return 'Windows';
    if (/Mac OS X/.test(ua)) return 'macOS';
    if (/Android/.test(ua)) return 'Android';
    if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
    if (/Linux/.test(ua)) return 'Linux';
    return navigator.platform || '未知';
  }

  setText('sub', detectOS() + '  ·  ' + detectBrowser());
  setText('br-ua', navigator.userAgent);
  setText('br-lang',
    (navigator.languages && navigator.languages.join(', ')) ||
    navigator.language || '--');
  try { setText('br-tz', Intl.DateTimeFormat().resolvedOptions().timeZone); }
  catch(e){ setText('br-tz', '--'); }

  function updateOnline(){ setText('br-online', navigator.onLine ? '是' : '否'); }
  updateOnline();
  window.addEventListener('online', updateOnline);
  window.addEventListener('offline', updateOnline);

  // ---------- 硬件 ----------
  setText('hw-cores', (navigator.hardwareConcurrency || '?') + ' 线程');
  var devMem = navigator.deviceMemory;
  setText('hw-mem', devMem ? ('≥ ' + devMem + ' GB（模糊值）') : '浏览器不暴露');
  setText('hw-screen',
    screen.width + ' × ' + screen.height +
    '  ·  可视 ' + screen.availWidth + '×' + screen.availHeight);
  setText('hw-dpr', (window.devicePixelRatio || 1) + 'x');
  setText('hw-touch',
    ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? '支持' : '不支持');

  // GPU via WebGL
  (function(){
    try{
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (!gl){ setText('hw-gpu', '不支持 WebGL'); return; }
      var dbg = gl.getExtension('WEBGL_debug_renderer_info');
      var name = dbg
        ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
        : gl.getParameter(gl.RENDERER);
      setText('hw-gpu', name || '未知');
    } catch(e){
      setText('hw-gpu', '读取失败');
    }
  })();

  // ---------- 电池 ----------
  (function(){
    if (!navigator.getBattery){
      setHTML('batt-info', '<span class="empty">此浏览器不支持电池 API</span>');
      return;
    }
    navigator.getBattery().then(function(b){
      function upd(){
        var pct = Math.round(b.level * 100);
        var color = pct >= 50 ? COLORS.green
                  : pct >= 20 ? COLORS.yellow
                  : COLORS.red;
        setBar(document.getElementById('batt-row'), pct, pct + '%', color);
        var info = b.charging ? '充电中' : '放电中';
        if (b.dischargingTime && isFinite(b.dischargingTime) && b.dischargingTime > 0){
          info += '  ·  剩余 ' + Math.round(b.dischargingTime / 60) + ' 分钟';
        }
        if (b.charging && b.chargingTime && isFinite(b.chargingTime) && b.chargingTime > 0){
          info += '  ·  ' + Math.round(b.chargingTime / 60) + ' 分钟后充满';
        }
        setText('batt-info', info);
      }
      upd();
      ['levelchange','chargingchange','chargingtimechange','dischargingtimechange']
        .forEach(function(ev){ b.addEventListener(ev, upd); });
    }).catch(function(){
      setHTML('batt-info', '<span class="empty">读取失败（需要 HTTPS 或 localhost）</span>');
    });
  })();

  // ---------- 网络 ----------
  (function(){
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (!conn){
      setText('net-type', '不支持');
      setText('net-down', '不支持');
      setText('net-rtt', '不支持');
      setText('net-save', '不支持');
      return;
    }
    function upd(){
      setText('net-type', conn.effectiveType ? conn.effectiveType.toUpperCase() : '--');
      setText('net-down', conn.downlink != null ? conn.downlink + ' Mbps' : '--');
      setText('net-rtt',  conn.rtt != null ? conn.rtt + ' ms' : '--');
      setText('net-save', conn.saveData ? '开启' : '关闭');
    }
    upd();
    conn.addEventListener('change', upd);
  })();

  // ---------- 存储配额 ----------
  (function(){
    if (!navigator.storage || !navigator.storage.estimate){
      setHTML('store-info', '<span class="empty">不支持存储估算</span>');
      return;
    }
    function fmt(bytes){
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
      return (bytes / 1073741824).toFixed(2) + ' GB';
    }
    function upd(){
      navigator.storage.estimate().then(function(est){
        var usage = est.usage || 0, quota = est.quota || 0;
        var pct = quota > 0 ? usage / quota * 100 : 0;
        setBar(document.getElementById('store-row'), pct, pct.toFixed(2) + '%');
        setText('store-info', '已用 ' + fmt(usage) + '  /  配额 ' + fmt(quota));
      }).catch(function(){
        setHTML('store-info', '<span class="empty">读取失败</span>');
      });
    }
    upd();
    setInterval(upd, 30000);
  })();

  // ---------- 折线图数据 ----------
  var HISTORY = 120;
  var fpsHist = new Array(HISTORY).fill(0);
  var heapHist = new Array(HISTORY).fill(0);
  var currentFps = 0;

  // FPS 采样
  (function(){
    var frames = 0;
    var lastT = performance.now();
    function loop(t){
      frames++;
      var elapsed = t - lastT;
      if (elapsed >= 500){
        currentFps = Math.round(frames * 1000 / elapsed);
        frames = 0;
        lastT = t;
        fpsHist.push(Math.min(120, currentFps));
        if (fpsHist.length > HISTORY) fpsHist.shift();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  // JS 堆采样
  function sampleHeap(){
    var pct = 0, text = '--', info = '';
    if (performance.memory){
      var used  = performance.memory.usedJSHeapSize;
      var limit = performance.memory.jsHeapSizeLimit;
      var total = performance.memory.totalJSHeapSize;
      pct = limit > 0 ? used / limit * 100 : 0;
      text = (used / 1048576).toFixed(1) + ' MB';
      info = '已用 ' + (used / 1048576).toFixed(1) + ' MB' +
             '  /  已分配 ' + (total / 1048576).toFixed(1) + ' MB' +
             '  /  上限 ' + (limit / 1048576).toFixed(0) + ' MB';
    } else {
      info = '此浏览器不暴露 JS 堆（Chrome / Edge 可用）';
    }
    heapHist.push(pct);
    if (heapHist.length > HISTORY) heapHist.shift();

    setBar(document.getElementById('heap-row'), pct, text);
    setText('heap-info', info);
  }

  // FPS UI
  function updateFpsUI(){
    var pct = Math.min(100, currentFps / 120 * 100);
    setBar(document.getElementById('fps-row'), pct,
           currentFps + ' FPS', fpsColor(currentFps));
  }

  // ---------- 折线图绘制 ----------
  var chart = document.getElementById('chart');
  var ctx = chart.getContext('2d');

  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    var rect = chart.getBoundingClientRect();
    chart.width  = Math.floor(rect.width  * dpr);
    chart.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);

  function drawChart(){
    var dpr = window.devicePixelRatio || 1;
    var w = chart.width / dpr, h = chart.height / dpr;
    ctx.clearRect(0, 0, w, h);

    var padL = 28, padT = 10, padR = 10, padB = 16;
    var x0 = padL, y0 = padT, x1 = w - padR, y1 = h - padB;
    var cw = x1 - x0, ch = y1 - y0;

    // 网格 + Y 轴
    ctx.strokeStyle = '#1c2028';
    ctx.fillStyle = '#4b5261';
    ctx.font = '10px Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    [0, 25, 50, 75, 100].forEach(function(pct){
      var y = y1 - ch * pct / 100;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.fillText(pct, x0 - 4, y);
    });

    function series(data, color, maxVal){
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (var i = 0; i < data.length; i++){
        var x = x0 + cw * i / (data.length - 1);
        var y = y1 - ch * Math.min(1, data[i] / maxVal);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    series(heapHist, '#5b8def', 100);   // JS 堆 0-100
    series(fpsHist,  '#3ddc84', 120);   // FPS 0-120

    // 图例
    ctx.font = '11px "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    var lx = x1 - 6;
    [{n:'JS堆', c:'#5b8def'}, {n:'FPS', c:'#3ddc84'}].forEach(function(it){
      ctx.textAlign = 'right';
      ctx.fillStyle = '#8b93a7';
      ctx.fillText(it.n, lx, y0 + 8);
      var tw = ctx.measureText(it.n).width;
      ctx.fillStyle = it.c;
      ctx.fillRect(lx - tw - 14, y0 + 5, 8, 6);
      lx -= tw + 24;
    });
  }

  // ---------- 时钟 ----------
  function updateClock(){
    var t = new Date();
    setText('clock', pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()));
  }

  // ---------- 主循环 ----------
  function tickUI(){
    updateClock();
    updateFpsUI();
    sampleHeap();
    drawChart();
  }

  window.addEventListener('load', function(){
    resizeCanvas();
    tickUI();
    setInterval(tickUI, 500);
  });

})();
</script>
</body>
</html>
